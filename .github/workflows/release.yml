name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.17.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Enable corepack
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch pinned assets
              run: node scripts/prepare-assets.cjs

            - name: Build app
              run: pnpm run build

            - name: Package windows (nsis + zip)
              run: npx electron-builder -p never -c electron-builder.config.js

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: opencapture-windows
                  path: |
                      build/*.exe
                      build/*.zip

            - name: Attach to GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      build/*.exe
                      build/*.zip

    macos:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.17.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch pinned assets
              run: node scripts/prepare-assets.cjs

            - name: Build app
              run: pnpm run build

            - name: Package unsigned darwin apps
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: |
                  node scripts/pack-macos.cjs --arch arm64
                  node scripts/pack-macos.cjs --arch x64

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: opencapture-macos
                  path: |
                      release/macos/darwin/*.dmg
                      release/macos/darwin/*.zip
                  if-no-files-found: warn

            - name: Attach to GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release/macos/darwin/*.dmg
                      release/macos/darwin/*.zip

    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.17.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install rpm toolchain
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch pinned assets
              run: node scripts/prepare-assets.cjs

            - name: Build app
              run: pnpm run build

            - name: Package linux (AppImage + deb + rpm + tar.gz)
              run: npx electron-builder --linux -p never -c electron-builder.config.js

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: opencapture-linux
                  path: |
                      build/*.AppImage
                      build/*.deb
                      build/*.rpm
                      build/*.tar.gz
                  if-no-files-found: warn

            - name: Attach to GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      build/*.AppImage
                      build/*.deb
                      build/*.rpm
                      build/*.tar.gz
