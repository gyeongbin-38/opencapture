<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="supported-color-schemes" content="light dark">
    <link rel="stylesheet" type="text/css" href="css/root.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .delay-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 18px 22px;
            border-radius: 14px;
            background: rgba(16, 16, 18, 0.92);
            color: #fff;
            -webkit-app-region: drag;
            user-select: none;
        }

        .delay-label {
            font-size: 12px;
            opacity: 0.72;
        }

        .delay-count {
            font-size: 44px;
            font-weight: 600;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .delay-progress {
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: #ffffff26;
            overflow: hidden;
        }

        .delay-progress-bar {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: #ffffffb3;
            transform-origin: left center;
            transform: scaleX(1);
            transition-property: transform;
            transition-timing-function: linear;
        }

        .delay-cancel {
            -webkit-app-region: no-drag;
            margin-top: 4px;
            padding: 3px 14px;
            border: 1px solid #ffffff40;
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }

        .delay-cancel:hover {
            background: #ffffff1f;
        }
    </style>
</head>

<body class="window_bg">
    <script src="captureDelay/captureDelay.ts" type="module"></script>
</body>

</html>
