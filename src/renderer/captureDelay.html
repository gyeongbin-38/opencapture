<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="supported-color-schemes" content="light dark">
    <link rel="stylesheet" type="text/css" href="css/root.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .delay-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 18px 22px;
            border-radius: 14px;
            background: rgba(16, 16, 18, 0.92);
            color: #fff;
            -webkit-app-region: drag;
            user-select: none;
        }

        .delay-label {
            font-size: 12px;
            opacity: 0.72;
        }

        .delay-count {
            font-size: 44px;
            font-weight: 600;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .delay-progress {
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: #ffffff26;
            overflow: hidden;
        }

        .delay-progress-bar {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: #ffffffb3;
            transform-origin: left center;
            transform: scaleX(1);
            transition-property: transform;
            transition-timing-function: linear;
        }

        .delay-stepper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .delay-adjust {
            -webkit-app-region: no-drag;
            padding: 2px 8px;
            border: 1px solid #ffffff33;
            border-radius: 999px;
            outline: none;
            background: transparent;
            color: #ffffffb3;
            font-size: 11px;
            cursor: pointer;
            transition:
                background-color 120ms ease,
                color 120ms ease;
        }

        .delay-adjust:hover {
            background: #ffffff1f;
            color: #fff;
        }

        .delay-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .delay-actions button {
            -webkit-app-region: no-drag;
            padding: 3px 14px;
            border: 1px solid #ffffff40;
            border-radius: 999px;
            outline: none;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 120ms ease;
        }

        .delay-skip {
            background: #ffffffe6;
            color: #161618;
        }

        .delay-skip:hover {
            background: #fff;
        }

        .delay-cancel {
            background: transparent;
            color: #fff;
        }

        .delay-cancel:hover {
            background: #ffffff1f;
        }

        .delay-actions button:focus-visible,
        .delay-adjust:focus-visible {
            outline: 2px solid #ffffffb3;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .delay-progress-bar {
                transition: none;
            }
        }
    </style>
</head>

<body class="window_bg">
    <script src="captureDelay/captureDelay.ts" type="module"></script>
</body>

</html>
